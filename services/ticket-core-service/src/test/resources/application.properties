# Test-only values - never used outside the test classpath.
jwt.legacy.secret=test-only-secret-key-for-unit-tests-32bytes-minimum-000000
supabase.jwks.uri=https://example.invalid/auth/v1/.well-known/jwks.json

# In-memory DB for full-context tests (e.g. HealthEndpointTest) so they never
# touch the real Supabase Postgres instance.
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# This sandbox has no real Redis reachable; Spring's own Redis health
# indicator is well-tested framework code, not something this project needs
# to re-verify, so it's disabled for tests only (production config is
# untouched - see application.properties).
management.health.redis.enabled=false
