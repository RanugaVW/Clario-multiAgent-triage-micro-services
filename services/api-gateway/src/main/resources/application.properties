server.port=8080

spring.application.name=api-gateway

spring.cloud.gateway.mvc.routes[0].id=ticket-core-service
spring.cloud.gateway.mvc.routes[0].uri=${TICKET_CORE_SERVICE_URL:http://ticket-core-service:8081}
# /api/v1/tickets is the versioned contract; /api/tickets is the deprecated alias
# (DC-015/DC-007) - the ticket service flags it with a Deprecation header.
spring.cloud.gateway.mvc.routes[0].predicates[0]=Path=/api/v1/tickets/**,/api/tickets/**

# Comma-separated list; override for deployments where the frontend is
# served from somewhere other than the local dev server (e.g. an
# EC2-hosted demo talking back to this gateway on the developer's machine).
clario.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

supabase.jwks.uri=https://mdvfvtpbwqhccmaarpli.supabase.co/auth/v1/.well-known/jwks.json
jwt.legacy.secret=${JWT_SECRET}

# SUP-003 / DC-021: DEBUG here logs request/security internals on every call, so
# it is opt-in (LOG_LEVEL_SECURITY=DEBUG) rather than the shipped default.
logging.level.org.springframework.security=${LOG_LEVEL_SECURITY:INFO}
logging.level.org.springframework.cloud.gateway=${LOG_LEVEL_GATEWAY:INFO}

# DC-021: every log line carries the request's correlation ID (set by
# CorrelationIdFilter; blank outside a request, e.g. at startup).
logging.pattern.level=%5p [cid=%X{correlationId:-}]

# FR-061/SUP-004: aggregate status only, never the per-component breakdown -
# this endpoint is public (needed for container/orchestrator probes with no
# JWT to present) and this service is the one actually reachable from outside
# the Docker network, so leaking internal routing/dependency detail here would
# matter more than on the two internal-only services.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# SEC-011: alert (log record on the "security.alert" logger) when one source
# causes this many authentication failures within the window. Detection only -
# nothing is blocked, so a low value cannot lock real users out.
clario.security.alert.failed-auth-threshold=${SECURITY_ALERT_FAILED_AUTH_THRESHOLD:10}
clario.security.alert.window-seconds=${SECURITY_ALERT_WINDOW_SECONDS:60}

# REL-011: on SIGTERM stop accepting new requests, let in-flight ones finish (up to
# this long) before the context closes. docker-compose's stop_grace_period must stay
# larger than the total drain time or Docker SIGKILLs the JVM mid-drain.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=${SHUTDOWN_TIMEOUT:20s}
