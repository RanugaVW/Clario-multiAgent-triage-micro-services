# Test-only values - never used outside the test classpath.
# Locally, spring-dotenv picks up clario-app/.env (present on disk but not
# committed), which resolved ${JWT_SECRET} and masked the fact that this
# service had no test-scoped override at all - CI has no such file, so
# SecurityConfig's @Value("${jwt.legacy.secret}") failed to resolve and the
# whole ApplicationContext failed to start (this is exactly what broke).
jwt.legacy.secret=test-only-secret-key-for-unit-tests-32bytes-minimum-000000
supabase.jwks.uri=https://example.invalid/auth/v1/.well-known/jwks.json

# api-gateway has spring-boot-starter-data-redis on its classpath (unused
# directly by this service, but present - see the duplicate-dependency
# warning in pom.xml), so Actuator auto-configures a Redis health
# indicator that drags the aggregate status to DOWN when Redis isn't
# reachable. This sandbox happens to have a real Redis running locally,
# which masked this exact failure the same way the JWT_SECRET one was
# masked by a local .env file - CI has no Redis, so it failed there.
# Disabled for tests only; production config is untouched.
management.health.redis.enabled=false
