server.port=8082
spring.application.name=agent-review-service

# Supabase PostgreSQL Database Connection
spring.datasource.url=jdbc:postgresql://db.mdvfvtpbwqhccmaarpli.supabase.co:5433/postgres
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Redis Queue - was previously undeclared here (Spring's bare "localhost"
# default silently pointed at nothing inside this service's own container;
# see docker-compose.yml's agent-review-service block for the real fix).
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}

# JWT verification (same Supabase project as api-gateway; no new secret needed)
supabase.jwks.uri=https://mdvfvtpbwqhccmaarpli.supabase.co/auth/v1/.well-known/jwks.json
jwt.legacy.secret=${JWT_SECRET}

# FR-061/FR-062/SUP-004: expose only the aggregate health status publicly (never
# the per-component breakdown) so /actuator/health can stay unauthenticated for
# container/orchestrator probes without leaking internal DB/Redis hostnames to
# anyone who can reach this endpoint.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# SEC-011: alert (log record on the "security.alert" logger) when one source
# causes this many authentication failures within the window. Detection only -
# nothing is blocked, so a low value cannot lock real users out.
clario.security.alert.failed-auth-threshold=${SECURITY_ALERT_FAILED_AUTH_THRESHOLD:10}
clario.security.alert.window-seconds=${SECURITY_ALERT_WINDOW_SECONDS:60}

# DC-021: every log line carries the request's correlation ID (set by
# CorrelationIdFilter; blank outside a request, e.g. at startup).
logging.pattern.level=%5p [cid=%X{correlationId:-}]

# REL-011: on SIGTERM stop accepting new requests, let in-flight ones finish (up to
# this long) before the context closes. docker-compose's stop_grace_period must stay
# larger than the total drain time or Docker SIGKILLs the JVM mid-drain.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=${SHUTDOWN_TIMEOUT:20s}
# REL-011: how long shutdown waits for tickets already saved to be pushed onto the
# Redis queue (TicketDispatcher). Runs after the web-server drain above.
clario.dispatch.drain-timeout-seconds=${DISPATCH_DRAIN_TIMEOUT_SECONDS:20}
