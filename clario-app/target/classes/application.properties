# Server Settings
server.port=8080

spring.config.import=optional:file:.env[.properties]

# Debug JWT validation
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.security.oauth2=TRACE

# Supabase PostgreSQL Database Connection
spring.datasource.url=jdbc:postgresql://db.mdvfvtpbwqhccmaarpli.supabase.co:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true


# Optional: Disable Open-in-view warning
spring.jpa.open-in-view=false

# Supabase JWKS Endpoint (new ES256 key)
supabase.jwks.uri=https://mdvfvtpbwqhccmaarpli.supabase.co/auth/v1/.well-known/jwks.json

# Legacy Supabase HS256 shared secret (still used for active sessions during key rotation)
jwt.legacy.secret=${JWT_SECRET}

# Redis Queue
spring.data.redis.host=localhost
spring.data.redis.port=6379
