

services:
  redis-broker:
    image: redis:alpine
    ports:
      - "6380:6379"

  api-gateway:
    build:
      context: ./services/api-gateway
      dockerfile: Dockerfile
    # REL-011: must exceed web-drain (20s) + Redis-dispatch drain (20s) or Docker
    # SIGKILLs the JVM (default grace is 10s) before the graceful shutdown finishes.
    stop_grace_period: 45s
    ports:
      - "8080:8080"
    env_file:
      - ./clario-app/.env
    environment:
      - JAVA_TOOL_OPTIONS=-Xmx256m -Xms256m
      - SPRING_PROFILES_ACTIVE=docker
    extra_hosts:
      - "host.docker.internal:host-gateway"

  ticket-core-service:
    build:
      context: ./services/ticket-core-service
      dockerfile: Dockerfile
    # REL-011: must exceed web-drain (20s) + Redis-dispatch drain (20s) or Docker
    # SIGKILLs the JVM (default grace is 10s) before the graceful shutdown finishes.
    stop_grace_period: 45s
    env_file:
      - ./clario-app/.env
    environment:
      - JAVA_TOOL_OPTIONS=-Xmx256m -Xms256m
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATA_REDIS_HOST=redis-broker
      - SPRING_DATA_REDIS_PORT=6379
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "db.mdvfvtpbwqhccmaarpli.supabase.co:host-gateway"

  agent-review-service:
    build:
      context: ./services/agent-review-service
      dockerfile: Dockerfile
    # REL-011: must exceed web-drain (20s) + Redis-dispatch drain (20s) or Docker
    # SIGKILLs the JVM (default grace is 10s) before the graceful shutdown finishes.
    stop_grace_period: 45s
    env_file:
      - ./clario-app/.env
    environment:
      - JAVA_TOOL_OPTIONS=-Xmx256m -Xms256m
      - SPRING_PROFILES_ACTIVE=docker
      # Was missing entirely: without this, the service's Redis client defaults
      # to localhost:6379 inside its own container, where nothing listens (the
      # broker is the separate redis-broker container). Every ticket created
      # through this service silently never reached the AI pipeline in the
      # real deployment - REL-002's new logging surfaces exactly this failure
      # (see NFR Testing/REL-002-Fault-Tolerance/), which is what caught it.
      - SPRING_DATA_REDIS_HOST=redis-broker
      - SPRING_DATA_REDIS_PORT=6379
    depends_on:
      - redis-broker
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "db.mdvfvtpbwqhccmaarpli.supabase.co:host-gateway"

  nlp-classifier-service:
    build:
      context: ./services/nlp-classifier-service
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ./clario-ml-sidecar/.env

  voice-to-text-service:
    build:
      context: ./services/voice-to-text-service
      dockerfile: Dockerfile
    ports:
      - "8002:8000"
    env_file:
      - ./clario-ml-sidecar/.env
    environment:
      # base decodes ~2.7x faster than small on CPU for the same transcript;
      # streaming latency is bounded by one decode. Use tiny if it still lags.
      - WHISPER_MODEL=base
      - WHISPER_DEVICE=cpu
      - WHISPER_COMPUTE_TYPE=int8
      - WHISPER_LANGUAGE=en
      - WHISPER_CACHE_DIR=/models
    volumes:
      # Keeps the downloaded Whisper snapshot across rebuilds.
      - whisper-models:/models

  ai-orchestrator-service:
    build:
      context: ./services/ai-orchestrator-service
      dockerfile: Dockerfile
    env_file:
      - ./clario-ml-sidecar/.env
    environment:
      - JAVA_TOOL_OPTIONS=-Xmx256m -Xms256m
      - REDIS_HOST=redis-broker
      - CLASSIFIER_URL=http://nlp-classifier-service:8000
      - VOICE_URL=http://voice-to-text-service:8000
      # Absolute path so the index survives rebuilds instead of landing in the
      # image's own vector_store/, which COPY overwrites every build.
      - CHROMA_PATH=/chroma_data
      # Overrides the .env's host-only absolute path, which doesn't exist
      # inside the container filesystem - points local_llm.py at the bind
      # mount below instead.
      - LLAMA_ADAPTER_PATH=/models/llama3-adapter
    volumes:
      - chroma-data:/chroma_data
      # The fine-tuned LoRA adapter isn't in git (it's local-only weights);
      # mounted read-only instead of COPY-ing it into the image, matching
      # how whisper-models is handled for voice-to-text-service.
      - "./Fine Tuned Llama-3.2 v2 (3B):/models/llama3-adapter:ro"
    depends_on:
      - redis-broker
      - nlp-classifier-service

volumes:
  whisper-models:
  chroma-data:
