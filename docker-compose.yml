version: '3.8'

services:
  redis-broker:
    image: redis:alpine
    ports:
      - "6379:6379"

  api-gateway:
    build:
      context: ./services/api-gateway
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    depends_on:
      - ticket-core-service

  ticket-core-service:
    build:
      context: ./services/ticket-core-service
      dockerfile: Dockerfile
    ports:
      - "8081:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATA_REDIS_HOST=redis-broker
    depends_on:
      - redis-broker

  agent-review-service:
    build:
      context: ./services/agent-review-service
      dockerfile: Dockerfile
    ports:
      - "8082:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker

  nlp-classifier-service:
    build:
      context: ./services/nlp-classifier-service
      dockerfile: Dockerfile
    ports:
      - "8000:8000"

  ocr-vision-service:
    build:
      context: ./services/ocr-vision-service
      dockerfile: Dockerfile
    ports:
      - "8001:8000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  ai-orchestrator-service:
    build:
      context: ./services/ai-orchestrator-service
      dockerfile: Dockerfile
    environment:
      - REDIS_HOST=redis-broker
      - CLASSIFIER_URL=http://nlp-classifier-service:8000
      - OCR_URL=http://ocr-vision-service:8000
    depends_on:
      - redis-broker
      - nlp-classifier-service
