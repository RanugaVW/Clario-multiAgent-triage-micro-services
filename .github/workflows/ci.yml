name: Clario Multi-Service CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # 1. Next.js Frontend
  build-and-test-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Lint
        working-directory: ./frontend
        run: npm run lint

      - name: Run Vitest
        working-directory: ./frontend
        run: npm run test

      - name: Build Next.js
        working-directory: ./frontend
        run: npm run build

  # 2. Java Spring Boot Services
  build-and-test-java-services:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [api-gateway, ticket-core-service, agent-review-service]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Maven Tests
        working-directory: ./services/${{ matrix.service }}
        run: mvn clean test

  # 3. Python AI/ML Services
  build-and-test-python-services:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [nlp-classifier-service, ocr-vision-service, ai-orchestrator-service]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: './services/${{ matrix.service }}/requirements.txt'

      - name: Install Dependencies
        working-directory: ./services/${{ matrix.service }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Run Pytest (if tests exist)
        working-directory: ./services/${{ matrix.service }}
        run: |
          if [ -d "tests" ]; then
            pytest tests/
          else
            echo "No tests directory found for ${{ matrix.service }}, skipping."
          fi
